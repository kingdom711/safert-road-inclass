plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
	}
}

group = 'com.jinsung'
version = '0.0.1-SNAPSHOT'
description = 'Safety Road - 스마트 안전관리 플랫폼'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Database - SQLite
	runtimeOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
	// Hibernate SQLite Dialect (Community)
	implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.4.Final'

	// Database - PostgreSQL (Production)
	implementation 'org.postgresql:postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Flyway (prod/Postgres 마이그레이션 관리)
	// dev(SQLite)에서는 application-dev.properties에서 비활성화하고 ddl-auto=update 사용
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// ULID Creator library (lexicographically sortable unique identifier)
	implementation 'com.github.f4b6a3:ulid-creator:5.2.3'

	// PDF 생성 (위험성평가표)
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'

	// QR 코드 (PDF 원본 검증용)
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// Excel 생성 (월간 위험요인 개선대장)
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// Spring AI - Google Gemini
	// Spring AI 1.0.0 BOM을 통해 버전 관리
	// Spring AI 1.0.0에서는 spring-ai-vertex-ai-gemini 사용
	// 이 의존성이 필요한 모든 하위 의존성(ChatModel 등)을 포함함
	implementation 'org.springframework.ai:spring-ai-vertex-ai-gemini'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Plain JAR 생성 방지 (실행 가능한 boot JAR만 생성)
jar {
	enabled = false
}
