# PostgreSQL Database (Supabase Connection Pooler)
# Supabase Pooler uses pgbouncer - requires prepareThreshold=0
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.uuzquwhlawldakidofee
spring.datasource.password=5vODY1gvc67wbaTt
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool 설정
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate - Production Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway 비활성화 (SQLite는 Flyway Teams 필요)
spring.flyway.enabled=false

# CORS 설정
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.safety-road.online}

# ===========================================
# Spring AI - Google Gemini Configuration (Production)
# ===========================================
spring.ai.google.gemini.api-key=${GEMINI_API_KEY:}

# ===========================================
# Legacy Gemini API Configuration
# ===========================================
custom.gemini.key=${GEMINI_API_KEY:}

# ===========================================
# Logging Configuration (Production)
# ===========================================
logging.level.root=INFO
logging.level.com.jinsung.safety_road_inclass=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# CloudType 환경에서는 파일 로깅 비활성화
logging.file.name=
