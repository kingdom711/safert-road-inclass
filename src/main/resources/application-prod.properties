# ===========================================
# Safety Road - Production Profile (Supabase Postgres)
# ===========================================

# Server Configuration
server.port=8080
server.address=0.0.0.0

# PostgreSQL Database (Supabase Connection Pooler)
# Supabase Pooler uses pgbouncer - requires prepareThreshold=0
# 모든 자격증명은 환경변수로만 주입 (코드/설정 파일에 평문 금지)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool 설정
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate - Production Settings
# 현재 커밋에는 실행 가능한 Flyway 마이그레이션 세트가 포함되지 않아
# prod 기동을 막지 않도록 Hibernate가 기존처럼 스키마를 보정한다.
# 실제 마이그레이션 파일을 src/main/resources/db/migration 에 정리한 뒤
# 그때 Flyway + validate 조합으로 전환한다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Keep Flyway disabled in Cloudtype until production migration startup is
# verified with runtime logs. Schema compatibility is handled separately.
spring.flyway.enabled=false

# ===========================================
# JWT Configuration (Production)
# ===========================================
# 기본값 없이 JWT_SECRET을 강제한다. 미설정 시 플레이스홀더 해석 실패로
# 애플리케이션 기동이 차단되어, 공개된 dev 기본 시크릿이 운영에 유입되지 않는다.
# Base64로 인코딩된 256bit 이상 랜덤 값을 환경변수로 주입할 것.
jwt.secret=${JWT_SECRET}

# ===========================================
# Spring AI - Google Gemini Configuration (Production)
# ===========================================
spring.ai.google.gemini.api-key=${GEMINI_API_KEY:}

# ===========================================
# Legacy Gemini API Configuration
# ===========================================
custom.gemini.key=${GEMINI_API_KEY:}

# ===========================================
# Project Admin Account (Production)
# ===========================================
# Configure these as environment variables in production. Leave blank to skip seeding.
project-admin.username=${PROJECT_ADMIN_USERNAME:}
project-admin.password=${PROJECT_ADMIN_PASSWORD:}

# ===========================================
# Logging Configuration (Production)
# ===========================================
logging.level.root=INFO
logging.level.com.jinsung.safety_road_inclass=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# CloudType 환경에서는 파일 로깅 비활성화
logging.file.name=
logging.file.path=

# ===========================================
# Supabase Storage Configuration
# ===========================================
supabase.storage.url=${SUPABASE_URL}
supabase.storage.key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_BUCKET:safety-road-photos}
