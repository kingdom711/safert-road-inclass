# ===========================================
# Safety Road - Production Profile (Supabase Postgres)
# ===========================================

# Server Configuration
server.port=8080
server.address=0.0.0.0

# PostgreSQL Database (Supabase Connection Pooler)
# Supabase Pooler uses pgbouncer - requires prepareThreshold=0
# 모든 자격증명은 환경변수로만 주입 (코드/설정 파일에 평문 금지)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool 설정
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate - Production Settings
# Flyway가 스키마를 단독 관리. Hibernate는 DB 스키마와 엔티티가 일치하는지 검증만 수행.
# 엔티티 변경 시 반드시 src/main/resources/db/migration/V{n}__설명.sql 마이그레이션도 함께 작성할 것.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===========================================
# Flyway (Postgres 마이그레이션)
# ===========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 기존 prod DB(ddl-auto가 만든 스키마)를 V12 시점으로 baseline 처리.
# 신규 마이그레이션은 V13__... 부터 작성.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=12
spring.flyway.validate-on-migrate=true

# ===========================================
# Spring AI - Google Gemini Configuration (Production)
# ===========================================
spring.ai.google.gemini.api-key=${GEMINI_API_KEY:}

# ===========================================
# Legacy Gemini API Configuration
# ===========================================
custom.gemini.key=${GEMINI_API_KEY:}

# ===========================================
# Logging Configuration (Production)
# ===========================================
logging.level.root=INFO
logging.level.com.jinsung.safety_road_inclass=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# CloudType 환경에서는 파일 로깅 비활성화
logging.file.name=
logging.file.path=

# ===========================================
# Supabase Storage Configuration
# ===========================================
supabase.storage.url=${SUPABASE_URL}
supabase.storage.key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_BUCKET:safety-road-photos}
