# ===========================================
# Safety Road - Development Profile (SQLite)
# ===========================================

# SQLite 파일 기반 Database (로컬 개발용)
spring.datasource.url=jdbc:sqlite:./data/safetyroad-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite는 username/password 불필요
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate - Development Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Flyway 비활성화 (dev=SQLite 로컬, 스키마는 ddl-auto=update가 처리)
# Flyway 마이그레이션은 prod(Postgres)에서만 실행됨
spring.flyway.enabled=false

# H2 Console 비활성화 (SQLite 사용)
spring.h2.console.enabled=false

# ===========================================
# Spring AI - Google Gemini Configuration (Development)
# ===========================================
spring.ai.google.gemini.api-key=${GEMINI_API_KEY:}

# ===========================================
# Legacy Gemini API Configuration
# ===========================================
custom.gemini.key=${GEMINI_API_KEY:}
